name: Daily Commodity SEPA+VCP Screener Update

on:
  schedule:
    # Times are UTC. After the US close, when US ETFs, stocks and CME futures have all settled.
    - cron: '30 21 * * 1-5'   # after the US close (~8:30 AM Melbourne Tue-Sat)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commodity-screener
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: "!contains(github.event.head_commit.message, 'Deploy:')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run screener and build dashboard
        run: python screener.py
      - name: Deploy to gh-pages branch
        run: |
          git config user.name "Commodity Screener Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp index.html /tmp/index.html
          rm -f index.html
          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
            git pull origin gh-pages
          else
            git checkout --orphan gh-pages
          fi
          git rm -rf . 2>/dev/null || true
          cp /tmp/index.html index.html
          git add index.html
          git commit -m "Deploy: $(TZ=Australia/Melbourne date '+%d %b %Y %H:%M %Z')" || echo "Nothing to commit"
          git push origin gh-pages
